<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Helper · AI 提示词工作台</title>
    <!-- 设计系统的两套字体（加载失败会自动回退到系统字体，不影响功能） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // 防主题闪烁：页面加载前先根据 localStorage 设置 <html> 的三个主题属性，
      // 避免先渲染错误主题再闪一下。KEY 必须与 src/composables/useTheme.ts 保持一致。
      // 兼容：老版本只存了 ph:theme，这里迁移到 ph:color。
      ;(function () {
        var doc = document.documentElement
        // ---- 色系（data-color）----
        var c = localStorage.getItem('ph:color')
        if (c !== 'dark' && c !== 'light') {
          c = localStorage.getItem('ph:theme') // 老版本迁移
        }
        if (c !== 'dark' && c !== 'light') {
          c = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        // ---- 风格（data-style）----
        var s = localStorage.getItem('ph:style')
        if (s !== 'clean' && s !== 'glass' && s !== 'industrial') s = 'clean'
        // data-theme 保留给旧 CSS 选择器（tokens.css 的代码高亮变量）作兼容
        doc.setAttribute('data-theme', c)
        doc.setAttribute('data-color', c)
        doc.setAttribute('data-style', s)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
