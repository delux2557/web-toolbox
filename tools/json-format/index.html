<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON 格式化 — web-toolbox</title>
<meta name="description" content="粘贴 JSON → 格式化 / 压缩 / 校验。纯静态单文件，零依赖零后端，数据不出浏览器。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='15' font-weight='700' fill='%23fff' text-anchor='middle'%3E%7B%7D%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
 * 设计令牌。亮色为默认，暗色走 [data-theme="dark"]。
 * 颜色一律用 oklch（感知均匀，调色不会出现脏灰）。
 * 刻意不引 Google Fonts：本工具要能 file:// 双击离线用，
 * 字体全部走系统字体栈。
 * ============================================================ */
:root {
  --font-sans: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;

  --bg: oklch(98.4% 0.003 250);
  --surface: oklch(100% 0 0);
  --surface-2: oklch(96.8% 0.006 250);
  --text: oklch(26% 0.02 255);
  --text-2: oklch(47% 0.016 255);
  --text-3: oklch(62% 0.012 255);
  --border: oklch(90.5% 0.007 250);
  --border-strong: oklch(84% 0.011 250);
  --accent: oklch(56% 0.19 268);
  --accent-strong: oklch(48% 0.20 268);
  --accent-soft: oklch(94.5% 0.04 268);
  --ok: oklch(52% 0.13 155);
  --ok-soft: oklch(95% 0.045 155);
  --warn: oklch(58% 0.12 70);
  --warn-soft: oklch(96% 0.05 85);
  --danger: oklch(54% 0.19 25);
  --danger-soft: oklch(95.5% 0.042 25);

  /* 输出区高亮配色。亮色侧统一压到 44%~58% 明度：
     白底（--surface）上都能过 4.5:1，又不会深到像纯黑那样糊成一片。 */
  --tok-key: oklch(45% 0.15 258);      /* 键名：偏冷蓝，与字符串值区分开 */
  --tok-string: oklch(44% 0.13 150);   /* 字符串值：绿 */
  --tok-number: oklch(48% 0.16 300);   /* 数字：紫 */
  --tok-literal: oklch(50% 0.13 60);   /* true / false / null：琥珀 */
  --tok-punct: oklch(58% 0.012 255);   /* 括号逗号冒号：故意压暗，不当主角 */
  --tok-bad: oklch(54% 0.19 25);       /* 词法认不出的字符，与 --danger 同色 */
  --guide: oklch(92% 0.006 250);       /* 缩进参考线：比 --border 再淡一档 */

  --radius-l: 12px;
  --radius: 9px;
  --radius-s: 7px;
  --shadow-1: 0 1px 2px oklch(0% 0 0 / .05), 0 1px 3px oklch(0% 0 0 / .04);
  --shadow-2: 0 10px 32px oklch(0% 0 0 / .10);
}
[data-theme="dark"] {
  --bg: oklch(21.5% 0.012 252);
  --surface: oklch(25.5% 0.014 252);
  --surface-2: oklch(29.5% 0.016 252);
  --text: oklch(94% 0.008 240);
  --text-2: oklch(78% 0.012 245);
  --text-3: oklch(62% 0.012 248);
  --border: oklch(33.5% 0.014 252);
  --border-strong: oklch(41% 0.016 252);
  --accent: oklch(72% 0.15 268);
  --accent-strong: oklch(80% 0.13 268);
  --accent-soft: oklch(33% 0.06 268);
  --ok: oklch(74% 0.14 155);
  --ok-soft: oklch(30% 0.055 155);
  --warn: oklch(80% 0.12 80);
  --warn-soft: oklch(31% 0.055 80);
  --danger: oklch(70% 0.16 25);
  --danger-soft: oklch(31% 0.065 25);

  /* 暗色侧把明度抬到 79%~85%（底是 oklch(25.5%) 的 --surface），
     保持与亮色相同的色相分工（键=蓝 / 值=绿 / 数=紫 / 字面量=琥珀）。 */
  --tok-key: oklch(80% 0.11 258);
  --tok-string: oklch(79% 0.12 150);
  --tok-number: oklch(80% 0.12 300);
  --tok-literal: oklch(84% 0.12 75);
  --tok-punct: oklch(63% 0.012 248);
  --tok-bad: oklch(72% 0.16 25);
  --guide: oklch(34% 0.014 252);

  --shadow-1: 0 1px 2px oklch(0% 0 0 / .3);
  --shadow-2: 0 10px 32px oklch(0% 0 0 / .4);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex; flex-direction: column;
  background: var(--bg); color: var(--text);
  font-family: var(--font-sans); font-size: 14px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button, select, textarea { font: inherit; color: inherit; }

/* ---------- 顶栏 ---------- */
header {
  display: flex; align-items: center; gap: 12px;
  padding: 0 18px; height: 56px; flex: 0 0 auto;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; letter-spacing: .01em; }
.brand svg { display: block; }
.brand small { font-weight: 400; font-size: 12px; color: var(--text-3); margin-left: 2px; }
.spacer { flex: 1 1 auto; }
.icon-btn {
  display: grid; place-items: center; width: 30px; height: 30px; padding: 0;
  border: 1px solid transparent; border-radius: var(--radius-s);
  background: transparent; color: var(--text-2); cursor: pointer;
  transition: background 130ms ease, color 130ms ease;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.icon-btn:disabled { opacity: .38; cursor: default; }
.icon-btn:disabled:hover { background: transparent; color: var(--text-2); }

/* 面板头部右侧的小动作区：复制 / 下载 / 打开文件。
   放在各自面板的头部，是因为它们分别只作用于那一侧的内容 ——
   塞进底部操作条会和「格式化」这类输入侧动作混在一起。 */
.pane-head .tools { display: flex; align-items: center; gap: 2px; }

/* 拖入文件时盖住整页的提示层。
   纯提示、不吃事件（pointer-events: none），否则会把 drop 事件自己挡掉。 */
.drop-hint {
  position: fixed; inset: 0; z-index: 9;
  display: none; place-items: center;
  background: var(--accent-soft); color: var(--accent-strong);
  box-shadow: inset 0 0 0 3px var(--accent);
  font-size: 15px; font-weight: 600;
  pointer-events: none;
}
body.dropping .drop-hint { display: grid; }

/* ---------- 主体：左右两栏（窄屏上下） ---------- */
main { flex: 1 1 auto; min-height: 0; display: flex; gap: 1px; background: var(--border); }
.pane { flex: 1 1 50%; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
.pane-head {
  display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
  padding: 8px 14px; font-size: 12px; color: var(--text-3);
  border-bottom: 1px solid var(--border);
}
.pane-head b { font-weight: 600; color: var(--text-2); font-size: 12px; letter-spacing: .02em; }
.pane-head .meta { margin-left: auto; font-family: var(--font-mono); font-size: 11.5px; }
textarea {
  flex: 1 1 auto; min-height: 0; width: 100%;
  padding: 12px 14px; border: 0; background: transparent; resize: none;
  font-family: var(--font-mono); font-size: 13px; line-height: 1.65;
  tab-size: 2; white-space: pre; overflow: auto;
}
textarea:focus { outline: none; }
#input::placeholder { color: var(--text-3); }
/* ---------- 输出区：<pre> 而不是 <textarea> ----------
   要语法高亮就得能往里面装元素，所以换成 <pre>。换来的两个损失都补回来了：
   ① <pre> 没有 placeholder → 用下面的 :empty::before + data-placeholder；
   ② <pre> 的 Ctrl+A 是「全选整页」（textarea 只选自己）→ JS 里挂 keydown 限定选区。
   其余排版参数（mono / 13px / 1.65 / tab-size）必须与 textarea 那条保持一致，
   否则左右两栏的行高与缩进对不齐。 */
#output {
  flex: 1 1 auto; min-height: 0; width: 100%;
  margin: 0; padding: 12px 14px; border: 0;
  background: var(--surface); overflow: auto;
  font-family: var(--font-mono); font-size: 13px; line-height: 1.65;
  tab-size: 2; white-space: pre;
  /* 底色 = 标点色：标点与空白**不再单独套元素**，直接继承这一层颜色 ——
     观感一分不变（标点本来就是"压暗、不当主角"），却省掉了本样本 8751 个元素。 */
  color: var(--tok-punct);
  --ind-w: 2ch;   /* 一层缩进占几列（ch 跟着等宽字体走）；JS 按当前缩进档改写 */
}
#output:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
#output:empty::before { content: attr(data-placeholder); color: var(--text-3); }
/* 输入改过之后结果就"过期"了：降透明度提示需要重新点一次，比直接清空更不伤数据 */
#output.is-stale { opacity: .5; }

/* ---------- 大输出着色中的反馈 ----------
   刻意**不用**居中转圈或遮罩：主线程正忙着建节点时动画自己也会顿，
   而遮罩更容易让人以为界面卡死。改成顶部 2px 细条 + 标题栏一行静默文字，
   走的是**真实进度**（已画行数 / 总行数），不糊弄人；画完自动收起，不做完成提示。 */
.hl-track { flex: 0 0 auto; height: 2px; background: var(--surface-2); overflow: hidden; }
.hl-track[hidden] { display: none; }
.hl-fill { height: 100%; width: 0; background: var(--accent); transition: width 120ms linear; }
.busy { margin-left: 8px; font-size: 12px; color: var(--text-3); }
.busy[hidden] { display: none; }

/* token 配色。class 名由 renderOutput() 从 TOK 枚举拼出来（tok-key / tok-string / …），
   两处必须对得上：改 TOK 的值就要同步改这里的类名。
   **故意没有 .tok-punct** —— 标点与空白退成文本节点、走 <pre> 的底色（见上面 #output 的 color），
   这是「节点瘦身」的主要来源，不是漏写。 */
.tok-key { color: var(--tok-key); }
.tok-string { color: var(--tok-string); }
.tok-number { color: var(--tok-number); }
.tok-literal { color: var(--tok-literal); }
.tok-bad { color: var(--tok-bad); text-decoration: underline wavy; }

/* 缩进参考线。两条都是踩过坑才定下来的：
   ① 竖线用**背景**画，不占布局宽度 —— 用 border 会把元素撑宽 1px，
      深层缩进累积下来整段文本会往右漂。
   ② 参考线里**必须保留原始空白文本**（span 的内容就是那几个空格/\t）。
      一开始写成空的 <span> + 固定宽度，视觉没问题，但 textContent 里的缩进**全丢了**
      —— 复制与下载会拿到没有缩进的 JSON。测试当场报红 5 条，这是功能性回归。
      现在宽度由真实空白撑出来，文本一个字符都不动。
   ③ 用**重复渐变**而不是「一层一个 span」：一行有几层就造几个元素的话，
      5000 行 / 95 KB 的输入光参考线就要 11500 个带阴影的元素；重复渐变把它们收成
      5251 个（一行一个），阴影 paint 也变成一次背景绘制。
      --ind-w 是「一层占几列」，由 JS 按当前缩进档写在 <pre> 上（ch 跟着等宽字体走）。 */
.ind {
  background-image: repeating-linear-gradient(to right,
    var(--guide) 0 1px, transparent 1px var(--ind-w));
}

/* ---------- 底部操作条 ---------- */
footer {
  flex: 0 0 auto; background: var(--surface); border-top: 1px solid var(--border);
}
.bar {
  display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
  padding: 10px 18px;
}
.bar label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); }
select {
  height: 30px; padding: 0 8px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-s);
  background: var(--surface-2); cursor: pointer; font-size: 12.5px;
}
select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn {
  height: 32px; padding: 0 14px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-s);
  background: var(--surface); color: var(--text-2);
  cursor: pointer; font-size: 13px; font-weight: 500;
  transition: background 130ms ease, color 130ms ease, border-color 130ms ease;
}
.btn:hover { background: var(--surface-2); color: var(--text); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn-primary {
  background: var(--accent); border-color: transparent; color: #fff;
}
.btn-primary:hover { background: var(--accent-strong); color: #fff; }
[data-theme="dark"] .btn-primary { color: oklch(20% 0.02 268); }

/* ---------- 状态条：只管「当前输入是什么状态」 ----------
   常驻、带语义色。**成功反馈不在这里** —— 那类是一次性动作的结果，走下方的 toast。
   这里留的是需要人盯着看的东西：报错（要照着行号列号去改、要复制引擎原文排查）、
   以及「没坏但得留意」的警告（超长整数精度、文件超限）。 */
.status {
  display: flex; align-items: baseline; gap: 8px; flex: 1 1 auto; min-width: 0;
  padding: 8px 18px; font-size: 12.5px;
  border-top: 1px solid var(--border);
  color: var(--text-3);
}
.status .mark { font-weight: 700; flex: 0 0 auto; }
.status .body { min-width: 0; word-break: break-word; }
.status .raw { display: block; margin-top: 2px; font-family: var(--font-mono); font-size: 11.5px; color: var(--text-3); }
.status.is-warn { color: var(--warn); background: var(--warn-soft); }
.status.is-error { color: var(--danger); background: var(--danger-soft); }
.status.is-error .raw { color: var(--danger); opacity: .78; }

/* ---------- 浮动提示：一次性动作的反馈，浮上来、停一会儿、自己退掉 ----------
   刻意**不做整块变色**：用中性的浮层卡片 + 一个语义色圆点表达结果，
   比把整条提示染成绿色克制，也不会和状态栏的警告色混淆。
   `aria-live` 容器必须常驻 DOM（display:none 会停掉播报），所以显隐走
   opacity / visibility 而不是 display。 */
.toast {
  position: fixed; left: 50%; bottom: 96px; z-index: 20;
  display: flex; align-items: center; gap: 9px;
  max-width: min(560px, calc(100vw - 48px));
  padding: 9px 16px;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: 999px;
  box-shadow: var(--shadow-2);
  font-size: 13px; line-height: 1.5;
  pointer-events: none;                  /* 不吃点击：它只是通知，不该挡住底下的按钮 */
  opacity: 0; visibility: hidden;
  transform: translate(-50%, 10px);      /* 从下方 10px 浮上来 */
  transition: opacity 180ms ease, transform 180ms ease, visibility 180ms ease;
}
.toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
.toast .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: var(--ok); }
.toast.is-warn .dot { background: var(--warn); }
.toast.is-error .dot { background: var(--danger); }

/* 用户要求减少动态效果时，只保留淡出，不做位移 */
@media (prefers-reduced-motion: reduce) {
  .toast { transform: translate(-50%, 0); transition: opacity 180ms ease, visibility 180ms ease; }
  .toast.show { transform: translate(-50%, 0); }
  /* 着色进度条同理：去掉宽度过渡。**合并进这一个块**而不是另开一个
     —— 另开会在文档里出现两处 prefers-reduced-motion，而测试是按
     「第一处 reduce 块」抓取来断言降级策略的，多一处就会抓错。 */
  .hl-fill { transition: none; }
}

/* ---------- 窄屏：改上下两栏 ---------- */
@media (max-width: 860px) {
  main { flex-direction: column; }
  .pane { flex: 1 1 50%; }
  .pane + .pane { border-top: 1px solid var(--border); }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="oklch(56% 0.19 268)"/>
      <text x="16" y="23" font-family="monospace" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">{}</text>
    </svg>
    JSON 格式化<small>零依赖 · 数据不出浏览器</small>
  </div>
  <div class="spacer"></div>
  <button class="icon-btn" id="btnTheme" type="button" title="切换明暗主题" aria-label="切换明暗主题">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>
    </svg>
  </button>
</header>

<main>
  <section class="pane">
    <div class="pane-head">
      <b>输入</b><span class="meta" id="inMeta">—</span>
      <span class="tools">
        <button class="icon-btn" id="btnOpenFile" type="button" title="打开本地文件（也可以直接把文件拖到页面上）" aria-label="打开本地文件">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.5 7.2A1.7 1.7 0 0 1 5.2 5.5h3.6l1.8 2.2h8.2a1.7 1.7 0 0 1 1.7 1.7v7.4a1.7 1.7 0 0 1-1.7 1.7H5.2a1.7 1.7 0 0 1-1.7-1.7z"/>
          </svg>
        </button>
      </span>
    </div>
    <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
      placeholder="把 JSON 粘到这里，或把 .json 文件拖进来，然后按 Ctrl + Enter 或点「格式化」。"></textarea>
  </section>
  <section class="pane">
    <div class="pane-head">
      <b>结果</b><span class="meta" id="outMeta">—</span>
      <span class="busy" id="outBusy" hidden>正在着色…</span>
      <span class="tools">
        <button class="icon-btn" id="btnCopy" type="button" title="复制结果到剪贴板" aria-label="复制结果" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8.6" y="8.6" width="11.4" height="11.4" rx="2.2"/>
            <path d="M15.4 8.6V6.2A1.7 1.7 0 0 0 13.7 4.5H6.2A1.7 1.7 0 0 0 4.5 6.2v7.5a1.7 1.7 0 0 0 1.7 1.7h2.4"/>
          </svg>
        </button>
        <button class="icon-btn" id="btnDownload" type="button" title="下载结果为 .json 文件" aria-label="下载结果" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4.2v10.4M7.8 10.4 12 14.6l4.2-4.2M4.6 18.4h14.8"/>
          </svg>
        </button>
      </span>
    </div>
    <div class="hl-track" id="hlTrack" hidden><div class="hl-fill" id="hlFill"></div></div>
    <pre id="output" tabindex="0" spellcheck="false"
      data-placeholder="结果会出现在这里（Ctrl + A 全选，或用右上角复制按钮）。"></pre>
  </section>
</main>

<div class="drop-hint" aria-hidden="true">松开鼠标 —— 读入这个文件</div>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<input type="file" id="fileInput" hidden>

<footer>
  <div class="bar">
    <label for="indent">缩进
      <select id="indent">
        <option value="2" selected>2 空格</option>
        <option value="4">4 空格</option>
        <option value="tab">Tab</option>
      </select>
    </label>
    <button class="btn btn-primary" id="btnFormat" type="button">格式化</button>
    <button class="btn" id="btnMinify" type="button">压缩成一行</button>
    <button class="btn" id="btnSort" type="button" title="递归按键名排序（数组顺序保持不变）">排序键名</button>
    <button class="btn" id="btnValidate" type="button">只校验</button>
    <button class="btn" id="btnClear" type="button">清空</button>
  </div>
  <div class="status" id="status" role="status" aria-live="polite">
    <span class="mark">·</span>
    <span class="body">就绪。粘贴 JSON 后按 <b>Ctrl + Enter</b> 直接格式化。</span>
  </div>
</footer>

<script>
/* ============================================================
 * 一、核心：纯函数（零依赖，与宿主无关）
 * ------------------------------------------------------------
 * 这一段是**可搬运**的部分。想把它搬进 code-workspace 的编辑器命令、
 * 或者包一层 CLI，复制这一段就够了 —— 下面的 UI 代码一行都不用带。
 * tests/format.test.mjs 直接从本文件里把这一段抠出来跑，
 * 所以被测的就是真正交付的这份代码，不存在"测试版 / 生产版"两份。
 * ============================================================ */
(function () {
  "use strict";

  /* 超过这个体量先提示一下：JSON.parse 本身是 O(n)，但把 10MB 塞进
     textarea 再全量重绘会让页面明显卡住 —— 与其偷偷卡死，不如先说清楚。 */
  var MAX_BYTES = 2 * 1024 * 1024;
  var BIGINT_DIGITS = 16;      // 超过 15 位有效数字就可能被 IEEE-754 改写

  /* 引擎报错文本 → 中文解释。
     键是**稳定的英文前缀**；一个都匹配不上就返回空串，界面只显示引擎原文。
     原则：宁可只给原文，也不硬套一句可能错的中文。 */
  var ERROR_HINTS = [
    ["Expected double-quoted property name", "属性名必须用双引号包起来 —— 不能是单引号，也不能是裸词。"],
    ["Expected property name or '}'", "这里应该是一个属性名（双引号）或右花括号。"],
    ["Expected ':' after property name", "属性名后面少了冒号。"],
    ["Expected ',' or '}' after property value", "属性值后面少了逗号或右花括号。"],
    ["Expected ',' or ']' after array element", "数组元素后面少了逗号或右方括号。"],
    ["Unexpected end of JSON input", "JSON 不完整 —— 结尾像是被截断了。"],
    ["Unexpected non-whitespace character after JSON", "JSON 已经结束，后面还有多余内容。"],
    ["Bad escaped character", "字符串里有非法的反斜杠转义。"],
    ["Bad control character", "字符串里有未转义的控制字符（比如直接敲了换行或 Tab）。"],
    ["is not valid JSON", "这不是一个合法的 JSON 值。顶层只能是对象、数组、字符串、数字、true、false 或 null。"],
    ["Unexpected token", "这里有无法识别的字符。"]
  ];

  function explain(message) {
    for (var i = 0; i < ERROR_HINTS.length; i++) {
      if (message.indexOf(ERROR_HINTS[i][0]) >= 0) return ERROR_HINTS[i][1];
    }
    return "";
  }

  /* 从引擎报错里抠出位置。报错格式各引擎不一样，实测过的三种：
       V8（Chrome / Edge / Node）：… at position 12 (line 3 column 1)
       SpiderMonkey（Firefox）：… at line 3 column 1 of the JSON data
       部分场景根本没有位置：Unexpected end of JSON input
     拿不到就返回 null —— 宁可不给位置，也绝不编一个错的出来。 */
  function errorPosition(message, text) {
    var m = message.match(/line\s+(\d+)\s+column\s+(\d+)/i);
    if (m) return { line: Number(m[1]), column: Number(m[2]) };

    m = message.match(/position\s+(\d+)/i);
    if (m) {
      var pos = Math.min(Number(m[1]), text.length);
      var before = text.slice(0, pos);
      var nl = before.lastIndexOf("\n");
      return { line: before.split("\n").length, column: pos - nl };
    }
    return null;
  }

  /* 「内容被截断」的判定：报错位置正好落在最后一个非空白字符之后。
     实测（V8）这个信号能干净地分开两类错误，不会误报：
       截断   {"a": [1, 2    → position 11 = 长度 11 → 落在末尾 ✓
       语法错 {"a": 1,}      → position  8 < 长度  9 → 不在末尾 ✗（那是多余的尾逗号）
     注意：拿不到 position 的报错（Unexpected end of JSON input）不用这条 ——
     它的原文本身已经说了「不完整」，再叠一句就重复了。 */
  function isTruncated(message, text) {
    var m = message.match(/position\s+(\d+)/i);
    if (!m) return false;
    return Number(m[1]) >= text.replace(/\s+$/, "").length;
  }

  /* 去掉 UTF-8 BOM。从记事本 / 某些导出工具粘过来会带，JSON.parse 会当场失败，
     而且报错信息（"Unexpected token"）完全不提示是 BOM 的锅。 */
  function stripBOM(s) {
    return s.charCodeAt(0) === 0xfeff ? s.slice(1) : s;
  }

  /* 统一入口：校验 / 格式化 / 压缩都走它 —— 保证三者对「合法」的判定完全一致，
     不会出现"校验说合法、格式化却报错"。 */
  function parseJson(text) {
    var src = stripBOM(text == null ? "" : String(text));
    if (!src.trim()) {
      return {
        ok: false,
        error: { message: "输入为空", hint: "请先粘贴一段 JSON。", line: null, column: null, empty: true }
      };
    }
    try {
      return { ok: true, value: JSON.parse(src), source: src };
    } catch (e) {
      var message = String((e && e.message) || e);
      var pos = errorPosition(message, src);
      return {
        ok: false,
        error: {
          message: message,
          hint: explain(message),
          line: pos ? pos.line : null,
          column: pos ? pos.column : null,
          truncated: isTruncated(message, src)
        }
      };
    }
  }

  /* 缩进档位 → JSON.stringify 的第三参。非法值一律回落 2 空格。
     抽出来是因为格式化与排序都要用 —— 两处各写一遍迟早会漂移。 */
  function indentOf(v) {
    return (v === "tab" || v === "\t") ? "\t" : (Number(v) || 2);
  }

  /* 递归按键名排序。
     两条不能动的：
     ① **数组必须保序** —— 数组顺序本身是语义（`[1,2]` 和 `[2,1]` 不是一个东西），排了就错；
     ② 赋值必须走 `Object.defineProperty`。
        实测：`{"__proto__":{"a":1},"b":2}` 用朴素的 `out[k] = v` 建新对象，
        `__proto__` 那个键会**静默消失**（输出只剩 `{"b":2}`，不报错也不警告）——
        因为普通赋值命中的是原型 setter。defineProperty 才能建出真正的自有属性。
        对一个「防止数据被悄悄改动」的工具来说，这是必须绕开的坑。 */
  function sortKeysDeep(value, compare) {
    if (Array.isArray(value)) return value.map(function (v) { return sortKeysDeep(v, compare); });
    if (value && typeof value === "object") {
      var out = {};
      Object.keys(value).sort(compare).forEach(function (k) {
        Object.defineProperty(out, k, {
          value: sortKeysDeep(value[k], compare),
          enumerable: true, writable: true, configurable: true
        });
      });
      return out;
    }
    return value;
  }

  /* 键名默认比较器。用 localeCompare 而不是码点比较：
     中文键名（"订单号" / "物料"）按码点排出来是乱序，按语言习惯排才符合直觉。
     代价是结果依赖运行环境的 locale —— 对「给人看」的工具这个取舍是对的。 */
  function compareKeys(a, b) { return a.localeCompare(b); }

  function formatJson(text, indent) {
    var r = parseJson(text);
    if (!r.ok) return r;
    return { ok: true, value: JSON.stringify(r.value, null, indentOf(indent)) };
  }

  function minifyJson(text) {
    var r = parseJson(text);
    if (!r.ok) return r;
    return { ok: true, value: JSON.stringify(r.value) };
  }

  function validateJson(text) {
    var r = parseJson(text);
    return r.ok ? { ok: true, value: r.value } : r;
  }

  /* 大整数精度告警。
     JSON.parse 把数字变成 IEEE-754 双精度，**整数超过 15 位就可能被悄悄改写**
     （1234567890123456789 → 1234567890123456800），而且不报错。
     对工单号 / 物料号 / 19 位 ID 这类标识符是灾难 —— 复制出去就错了。
     这里**只告警、不改数据**：真要保住这些值，得让上游把它们当字符串传。

     实现要点：必须**跳过字符串内部**，否则 `"orderId": "1234…789"` 会误报。
     所以这里用一个小状态机而不是正则 —— 正则没法可靠地区分"引号内"与"引号外"。 */
  function findLongIntegers(text) {
    var hits = [];
    var inStr = false, esc = false, start = -1, buf = "";

    function flush() {
      if (start < 0) return;
      /* 只看整数部分的位数：1.2e30 的整数部分只有 1 位，是可精确表示的 */
      var intPart = buf.split(/[.eE]/)[0].replace(/^[-+]/, "");
      if (intPart.length >= BIGINT_DIGITS) {
        var before = text.slice(0, start);
        hits.push({
          text: buf,
          line: before.split("\n").length,
          column: start - before.lastIndexOf("\n")
        });
      }
      start = -1; buf = "";
    }

    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inStr) {
        if (esc) esc = false;
        else if (c === "\\") esc = true;
        else if (c === '"') inStr = false;
        continue;
      }
      if (c === '"') { flush(); inStr = true; continue; }
      if (c >= "0" && c <= "9") { if (start < 0) start = i; buf += c; continue; }
      /* 小数点 / 指数继续吃进来，免得把 1.2345678901234568e2 当整数 */
      if (start >= 0 && (c === "." || c === "e" || c === "E" || c === "+" || c === "-")) { buf += c; continue; }
      flush();
    }
    flush();
    return hits;
  }

  /* ---------- 词法分析（tokenize）----------
     这是一个**词法器**，不是解析器：不判合法性、不抛异常，多烂的输入都返回 token 数组。
     这样它永远不会跟 JSON.parse 打架 ——「什么算合法」始终只有 parseJson 一个判定源。

     也**故意不用它做报错定位**：报错位置已经来自引擎 message（现成行列号），
     让词法器参与定位等于引入第二个"什么算合法"的判定源。

     token 形如 { type, start, end, raw }；raw 是**原文切片**（未解义、未转义），
     要拼进 HTML 必须再过一次实义转义 —— 那是高亮那条路的 XSS 防线。 */
  var TOK = { PUNCT: "punct", STRING: "string", NUMBER: "number", LITERAL: "literal", WS: "ws", BAD: "bad" };
  var LITERALS = ["true", "false", "null"];

  function isDigit(ch) { return ch >= "0" && ch <= "9"; }

  function tokenize(src) {
    var s = typeof src === "string" ? src : "";
    var out = [], i = 0, n = s.length;

    function push(type, start, end) {
      out.push({ type: type, start: start, end: end, raw: s.slice(start, end) });
    }

    while (i < n) {
      var c = s[i];

      if (c === " " || c === "\t" || c === "\n" || c === "\r") {
        var j = i + 1;
        while (j < n && (s[j] === " " || s[j] === "\t" || s[j] === "\n" || s[j] === "\r")) j++;
        push(TOK.WS, i, j); i = j; continue;
      }

      if (c === "{" || c === "}" || c === "[" || c === "]" || c === ":" || c === ",") {
        push(TOK.PUNCT, i, i + 1); i++; continue;
      }

      if (c === "\"") {
        /* 扫到配对的收尾引号；**未闭合就一路吃到结尾**，不抛异常。 */
        var k = i + 1, esc = false;
        while (k < n) {
          var d = s[k];
          if (esc) { esc = false; k++; continue; }
          if (d === "\\") { esc = true; k++; continue; }
          if (d === "\"") { k++; break; }
          k++;
        }
        push(TOK.STRING, i, k); i = k; continue;
      }

      if (isDigit(c) || (c === "-" && isDigit(s[i + 1]))) {
        var p = i + 1;
        while (p < n && isDigit(s[p])) p++;
        if (s[p] === ".") { p++; while (p < n && isDigit(s[p])) p++; }
        if (s[p] === "e" || s[p] === "E") {
          var q = p + 1;
          if (s[q] === "+" || s[q] === "-") q++;
          if (isDigit(s[q])) { p = q; while (p < n && isDigit(s[p])) p++; }
        }
        push(TOK.NUMBER, i, p); i = p; continue;
      }

      var lit = null;
      for (var L = 0; L < LITERALS.length; L++) {
        if (s.substr(i, LITERALS[L].length) === LITERALS[L]) { lit = LITERALS[L]; break; }
      }
      if (lit) { push(TOK.LITERAL, i, i + lit.length); i += lit.length; continue; }

      /* 词法层面认不出的字符（`'x'`、`NaN`、`//注释`…）。
         不抛异常 —— 标成 bad 交给上层展示，合法性依旧由 parseJson 说了算。 */
      push(TOK.BAD, i, i + 1); i++;
    }
    return out;
  }

  /* 行、列都从 1 起（与 findLongIntegers 的约定一致）*/
  function positionAt(text, index) {
    var before = text.slice(0, index);
    return { line: before.split("\n").length, column: index - before.lastIndexOf("\n") };
  }

  /* 把字符串字面量解义成它代表的键名。
     必须**解义之后**才能判重 —— JSON 里 "a" 与 "\u0061" 是同一个键。
     非法转义原样保留（依然不判合法性）。 */
  var ESC_MAP = { n: "\n", t: "\t", r: "\r", b: "\b", f: "\f", "\"": "\"", "\\": "\\", "/": "/" };

  function decodeJsonString(raw) {
    var s = raw;
    if (s.charAt(0) === "\"") s = s.slice(1);
    if (s.length && s.charAt(s.length - 1) === "\"") s = s.slice(0, -1);
    if (s.indexOf("\\") < 0) return s;
    return s.replace(/\\(u[0-9a-fA-F]{4}|[\s\S])/g, function (m, g) {
      if (g.charAt(0) === "u") return String.fromCharCode(parseInt(g.slice(1), 16));
      return Object.prototype.hasOwnProperty.call(ESC_MAP, g) ? ESC_MAP[g] : m;
    });
  }

  /* ---------- 重复键检测 ----------
     JSON 规范**允许**重复键（同名时语义由实现决定），而 JSON.parse 的做法是
     **静默只保留最后一个** —— 前面那些被无声丢弃。所以这是**警告**不是错误：
     不改 parseJson 的判定，也不拦任何操作。

     做法：tokenize 走一遍，维护「当前对象已见键」的栈。字符串后面紧跟冒号、
     且栈顶是对象帧时，它才是键 —— 数组里的字符串不是键，自然也不判重。 */
  function findDuplicateKeys(src) {
    /* 每个 { 或 [ 压一帧「本层已见键」；顶层（栈空）的字符串不算键。
       seen 必须用 Object.create(null)：否则 key 为 "__proto__" 时会命中原型 setter，
       重复键**静默漏报** —— 与 sortKeysDeep 踩过的是同一个坑。 */
    var toks = tokenize(src), dups = [], stack = [];

    for (var i = 0; i < toks.length; i++) {
      var t = toks[i];

      if (t.type === TOK.PUNCT) {
        if (t.raw === "{" || t.raw === "[") stack.push(Object.create(null));
        else if (t.raw === "}" || t.raw === "]") stack.pop();
        continue;
      }

      if (t.type !== TOK.STRING) continue;

      var seen = stack[stack.length - 1];
      if (!seen) continue;                                   // 顶层 —— 字符串没有"键"这层身份

      /* 「是不是键」只有这一条判据：**后面紧跟冒号**（中间允许空白）。
         它同时排掉两类不是键的字符串 —— 对象里的**值**，
         以及**数组元素**（数组里字符串后面只会是 , 或 ]）。
         所以这里**不需要**再单独判断"当前层是对象还是数组"：
         那条分支永远走不到，是死代码（反向实验 R4 就是这么发现的，已删）。 */
      var k = i + 1;
      while (k < toks.length && toks[k].type === TOK.WS) k++;
      var nx = toks[k];
      if (!nx || nx.type !== TOK.PUNCT || nx.raw !== ":") continue;

      var key = decodeJsonString(t.raw);
      if (Object.prototype.hasOwnProperty.call(seen, key)) {
        var at = positionAt(src, t.start);
        dups.push({ key: key, line: at.line, column: at.column, first: seen[key] });
      } else {
        seen[key] = positionAt(src, t.start);
      }
    }
    return dups;
  }

  /* 行数 / 字节数：状态栏与 meta 用 */
  function countLines(s) { return s ? s.split("\n").length : 0; }
  function byteSize(s) {
    /* 用 TextEncoder 而不是 s.length：中文是 3 字节，length 会给出一半的数 */
    try { return new TextEncoder().encode(s).length; } catch (_) { return s.length; }
  }

  /* 把核心挂到一个命名空间上，供测试取用。
     浏览器里它就是 window.JSONFMT；测试在 Node 里用同一个对象。 */
  var API = {
    MAX_BYTES: MAX_BYTES,
    BIGINT_DIGITS: BIGINT_DIGITS,
    ERROR_HINTS: ERROR_HINTS,
    explain: explain,
    errorPosition: errorPosition,
    isTruncated: isTruncated,
    stripBOM: stripBOM,
    parseJson: parseJson,
    indentOf: indentOf,
    sortKeysDeep: sortKeysDeep,
    compareKeys: compareKeys,
    formatJson: formatJson,
    minifyJson: minifyJson,
    validateJson: validateJson,
    findLongIntegers: findLongIntegers,
    tokenize: tokenize,
    decodeJsonString: decodeJsonString,
    findDuplicateKeys: findDuplicateKeys,
    countLines: countLines,
    byteSize: byteSize
  };
  if (typeof window !== "undefined") window.JSONFMT = API;
  if (typeof module !== "undefined" && module.exports) module.exports = API;

  /* ============================================================
   * 二、界面（只是上面那组函数的壳）
   * ============================================================ */
  if (typeof document === "undefined") return;

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    input: $("input"), output: $("output"), indent: $("indent"),
    inMeta: $("inMeta"), outMeta: $("outMeta"), status: $("status"),
    btnFormat: $("btnFormat"), btnMinify: $("btnMinify"), btnSort: $("btnSort"),
    btnValidate: $("btnValidate"), btnClear: $("btnClear"), btnTheme: $("btnTheme"),
    btnCopy: $("btnCopy"), btnDownload: $("btnDownload"),
    btnOpenFile: $("btnOpenFile"), fileInput: $("fileInput"), toast: $("toast"),
    hlTrack: $("hlTrack"), hlFill: $("hlFill"), outBusy: $("outBusy")
  };

  /* 局部存储一律 try/catch：file:// 下或隐私模式里 localStorage 可能直接抛，
     不能因为存不了偏好就让整个页面报错。 */
  var THEME_KEY = "jf-theme";      // 前缀 jf- 是为了避开同域其它工具（如 code-workspace 的 cw-）
  /* 从文件读进来时记住原文件名，下载结果时沿用它 —— 免得每次都要手动改名。 */
  var sourceName = "";
  function readTheme() {
    try { return localStorage.getItem(THEME_KEY); } catch (_) { return null; }
  }
  function writeTheme(v) {
    try { localStorage.setItem(THEME_KEY, v); } catch (_) { /* 存不了就算了，本次会话内仍有效 */ }
  }

  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    els.btnTheme.title = t === "dark" ? "切换到亮色主题" : "切换到暗色主题";
  }
  function initTheme() {
    var saved = readTheme();
    if (saved === "dark" || saved === "light") { applyTheme(saved); return; }
    var dark = false;
    try { dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (_) {}
    applyTheme(dark ? "dark" : "light");
  }

  /* 状态条三种态：ok / warn / error —— 一次只显示一条，不叠信息 */
  function setStatus(kind, mark, body, raw) {
    els.status.className = "status" + (kind ? " is-" + kind : "");
    els.status.textContent = "";        // 清子节点；一律走 textContent，不拼 HTML
    var m = document.createElement("span");
    m.className = "mark"; m.textContent = mark;
    var b = document.createElement("span");
    b.className = "body"; b.textContent = body;
    els.status.appendChild(m);
    els.status.appendChild(b);
    if (raw) {
      var r = document.createElement("span");
      r.className = "raw"; r.textContent = raw;
      b.appendChild(r);
    }
  }

  /* 状态栏回到「就绪」。一次操作做成了之后用它把上一条残留清掉 ——
     注意这不是「报成功」，成功反馈一律走 toast。 */
  function clearStatus() {
    setStatus("", "·", "就绪。粘贴 JSON 后按 Ctrl + Enter 直接格式化。");
  }

  /* ---------- 浮动提示 ----------
     分工一句话：**会自己消失的只放"做成了"**。
     报错和警告一律留在状态栏 —— 那类信息用户要盯着看（照着行列号改），
     甚至要复制引擎原文去排查，三秒后自动消失等于把工具最要紧的能力毁掉。
     同一时刻只留一条：新的直接顶掉旧的，并重置计时，避免叠成一摞。 */
  var TOAST_MS = 2600;
  var toastTimer = 0;
  function toast(text, kind) {
    var base = "toast" + (kind ? " is-" + kind : "");
    els.toast.className = base;       // 先摘掉 show
    els.toast.textContent = "";
    var dot = document.createElement("span");
    dot.className = "dot";
    var body = document.createElement("span");
    body.className = "body";
    body.textContent = text;
    els.toast.appendChild(dot);
    els.toast.appendChild(body);
    void els.toast.offsetWidth;       // 强制一帧：连续两次操作时动画才会重播而不是原地不动
    els.toast.className = base + " show";
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastTimer = 0;
      els.toast.className = base;
    }, TOAST_MS);
  }

  /* 输入变了就把结果标成「已过期」，而不是清空它 ——
     清空会让「格式化完想再改一个字对比一下」的人白丢结果；
     不清空又会出现「左边已经改过、右边还是旧结果」的误解。
     标一下，两边的代价都避开。 */
  function markStale() {
    if (!outputText()) return;
    els.output.classList.add("is-stale");
    els.outMeta.textContent = "已过期";
  }
  function unmarkStale() {
    els.output.classList.remove("is-stale");
  }

  function syncMeta() {
    var t = els.input.value;
    els.inMeta.textContent = t ? countLines(t) + " 行 · " + byteSize(t) + " 字节" : "—";
  }

  /* 位置前缀：能拿到位置就给「第 N 行第 M 列」，拿不到就只说错误本身 */
  function where(e) {
    if (e.line == null) return "";
    return "第 " + e.line + " 行第 " + e.column + " 列：";
  }

  function showError(e) {
    if (e.empty) { setStatus("", "·", "还没有内容 —— 先把 JSON 贴到左边。"); return; }
    var body = where(e) + (e.hint || "JSON 解析失败。");
    if (e.truncated) body += "报错点正好落在输入末尾 —— 检查一下是不是没粘完。";
    setStatus("error", "✗", body, e.message);
  }

  /* 大整数告警。与其它告警一起由 collectWarnings() 汇总，统一走状态栏。 */
  function bigintWarning() {
    var hits = findLongIntegers(stripBOM(els.input.value));
    if (!hits.length) return null;
    var first = hits[0];
    return "检测到 " + hits.length + " 个超过 " + (BIGINT_DIGITS - 1) + " 位的整数（第 " +
      first.line + " 行：…" + first.text.slice(-8) + "）—— JSON 数字是双精度，" +
      "这类长 ID 的末尾几位可能已被悄悄改写。建议让上游把它们当字符串传。";
  }

  /* 重复键告警：和大整数告警同一条通路 —— 都属于「做成了，但请你注意」。
     措辞必须说清「这不是错」+「会丢掉什么」，否则用户会以为工具坏了。 */
  function duplicateKeyWarning() {
    var dups = findDuplicateKeys(stripBOM(els.input.value));
    if (!dups.length) return null;
    var first = dups[0];
    return "检测到 " + dups.length + " 个重复键（第一个在第 " + first.line + " 行第 " + first.column +
      " 列：" + JSON.stringify(first.key) + "）—— JSON 允许重复键，但解析时只保留最后一个，" +
      "前面的会被静默丢弃。";
  }

  /* 告警可能不止一种，全部走状态栏（会自己消失的只放"做成了"）。
     顺序固定：先大整数（数值被改写比键被覆盖更隐蔽），再重复键。 */
  function collectWarnings() {
    var ws = [];
    var a = bigintWarning(); if (a) ws.push(a);
    var b = duplicateKeyWarning(); if (b) ws.push(b);
    return ws.join("");
  }

  /* ---------- 输出区渲染 ----------
     ★ 刻意用**真 DOM 节点**（createTextNode / createElement）而不是 innerHTML 拼串：
       数据永远走文本节点，标签结构不可能被内容破坏 —— XSS 是**结构性免疫**，
       不依赖某个转义函数写对（也就没地方可以写错）。
       代价是节点多时比一次性 innerHTML 慢，所以超过阈值直接退回纯文本。
     ★ 输出文本的唯一读取口是 outputText()。以前是 els.output.value（textarea 自带），
       换成 <pre> 之后 value 不存在了 —— 散落的 .value 会**静默变成 undefined**
       （不报错，只是复制/下载拿到空串），所以全部收敛到这一个函数。 */

  /* ── 渲染预算 ──────────────────────────────────────────────────────────
     成本的真实驱动量是**元素节点数**，不是字节数：
       实测 95 KB / 5252 行的输入 → 27,001 个 <span>；而旧的 128 KB 阈值要 129 KB
       才触发 —— 等于那道阈值恰好挡不住最痛的那一段（76 KB ~ 128 KB 之间）。
       而 JSON.parse 只要 0.2 ms、tokenize 只要 4 ms：卡顿**全在渲染**，不在解析。
     所以判据改成分级，字节数只当便宜的粗筛：
       > HL_MAX_BYTES   → 不必 tokenize，直接纯文本
       元素数 > 上限     → 退回纯文本（只关着色，文本完整）
       元素数 ≤ "同步"   → 一次同步画完（小输入的体感**完全不变**，不引入异步）
       其余             → 分帧画：先同步画开头一小段，其余分块补齐并把主线程让回去 */
  var HL_MAX_BYTES = 512 * 1024;   // 粗筛：挡住 tokenize 自己都吃不消的巨型输入
  var HL_MAX_ELEMENTS = 60000;     // 超过 → 退回纯文本
  /* 同步上限取 8000：≈ 3500 行 / 63 KB，这个量级一次画完约 70 ms（肉眼无感），
     所以**这一段的行为与改造前逐字节一致**，不会为了没必要的分帧闪一下进度条。
     再往上（3500 行以上）才开始分帧 —— 那里确实一次画不完。 */
  var HL_SYNC_ELEMENTS = 8000;
  var HL_FIRST_LINES = 200;        // 分帧：先同步画这么多行，让用户立刻看到开头
  var HL_CHUNK_LINES = 300;        // 分帧：每块最多多少行（与时间预算先到为准）
  var HL_CHUNK_MS = 8;             // 分帧：每块最多占用主线程多少毫秒

  function outputText() { return els.output.textContent; }

  function makeNode(cls, text) {
    var s = document.createElement("span");
    if (cls) s.className = cls;
    if (text != null) s.textContent = text;
    return s;
  }

  /* 「这个字符串是不是键」只有一条判据：**同一行里后面紧跟冒号**。
     与 findDuplicateKeys 是同一条判据（那边跨整条 token 流，这边只看行内片段）——
     它同时排掉两类不是键的字符串：对象里的**值**、以及数组元素。 */
  function isKeyFragment(frags, i) {
    for (var j = i + 1; j < frags.length; j++) {
      if (frags[j].type === TOK.WS) continue;
      return frags[j].type === TOK.PUNCT && frags[j].raw === ":";
    }
    return false;
  }

  /* 把一个 token 流按行切开（纯数据，不建任何 DOM）。
     合法 JSON 的字符串里不会有裸换行，所以每个 token 都落在单行；
     仍然按 \n 再切一刀，是为了畸形输入也不至于把结构画错。 */
  function splitLines(toks) {
    var lines = [[]];
    for (var i = 0; i < toks.length; i++) {
      var parts = String(toks[i].raw).split("\n");
      for (var p = 0; p < parts.length; p++) {
        if (p > 0) lines.push([]);
        if (parts[p]) lines[lines.length - 1].push({ type: toks[i].type, raw: parts[p] });
      }
    }
    return lines;
  }

  /* 行首有空白 → 1（那个空白片段要变成一个 .ind），否则 0 */
  function leadAt(frags) {
    return (frags.length && frags[0].type === TOK.WS) ? 1 : 0;
  }

  /* 一个片段要不要单独套元素 —— ★ **只有这一处判据**，数元素与画元素共用。
     两处各写一份迟早漂移成「数的和画的不一样」，而那种偏差不会报错，
     只会让阈值骗人（以为只有 4000 个元素、其实造了 8000 个）。 */
  function fragClass(frags, i) {
    var f = frags[i];
    if (f.type === TOK.STRING) return isKeyFragment(frags, i) ? "tok-key" : "tok-string";
    /* 标点与空白**不套元素**：标点本来就被定成「压暗、不当主角」的角色，
       颜色交给 <pre> 的底色（--tok-punct），退成文本节点即可。
       文本节点不进布局树、不必匹配选择器 —— 本样本这一项省掉 8751 个元素。 */
    if (f.type === TOK.PUNCT || f.type === TOK.WS) return "";
    return "tok-" + f.type;
  }

  /* 数「会造出多少个元素」。只数元素、不数文本节点 —— 贵的只有元素。 */
  function countElements(lines) {
    var n = 0;
    for (var li = 0; li < lines.length; li++) {
      var frags = lines[li], start = leadAt(frags);
      if (start) n++;                                    // 行首参考线
      for (var i = start; i < frags.length; i++) if (fragClass(frags, i)) n++;
    }
    return n;
  }

  /* 画一行（节点都挂在 host 上）。needNL：行首要补一个换行（首行之外都要）。
     行首空白整段装进**一个** .ind —— 多层竖线由 CSS 的重复渐变一次画完，
     不再一层一个 span。span 里装的仍是原始空白，textContent 一个字符都不差。 */
  function paintLine(host, frags, needNL) {
    if (needNL) host.appendChild(document.createTextNode("\n"));
    var start = leadAt(frags);
    if (start) host.appendChild(makeNode("ind", frags[0].raw));
    /* 连续的不上色片段（标点 / 空白）攒成**一个**文本节点：
       结构上仍是文本，textContent 完全等价，但少了成百上千个小节点。 */
    var pending = "";
    var flush = function () {
      if (pending) { host.appendChild(document.createTextNode(pending)); pending = ""; }
    };
    for (var i = start; i < frags.length; i++) {
      var cls = fragClass(frags, i);
      if (cls) { flush(); host.appendChild(makeNode(cls, frags[i].raw)); }
      else pending += frags[i].raw;
    }
    flush();
  }

  /* 让出主线程：有调度器就用调度器（background 优先级，不跟用户交互抢），
     否则退到 setTimeout。★ 抽成一个变量是为了测试能驱动它 ——
     分帧渲染如果没被测到，等于没写。 */
  var yieldToMain = (typeof scheduler !== "undefined" && scheduler.postTask)
    ? function (fn) { scheduler.postTask(fn, { priority: "background" }); }
    : function (fn) { setTimeout(fn, 0); };

  var rendering = false;   // 分帧正在画：此时复制/下载要禁用（textContent 还是半截的）
  var renderSeq = 0;       // 每次渲染自增；老的分帧任务发现序号变了就自己收手

  function setProgress(ratio) {
    if (els.hlFill) els.hlFill.style.width = Math.round(ratio * 100) + "%";
  }
  function setBusy(on) {
    rendering = on;
    if (els.hlTrack) els.hlTrack.hidden = !on;
    if (els.outBusy) els.outBusy.hidden = !on;
    if (!on) setProgress(0);
    syncOutputActions();
  }

  /* 分帧渐进渲染：先把开头一小段**同步**画上去（用户不必盯着空屏），其余分块补齐。
     每块之间把主线程还回去 —— 于是进度条能动、滚动能响应、按钮能点，
     感知上从「整体冻结」变成「结果逐渐长出来」。总节点数没变，变的是**可交互性**。 */
  function paintChunked(pre, lines, my) {
    var total = lines.length;
    var upto = Math.min(HL_FIRST_LINES, total);
    var head = document.createElement("span");
    for (var i = 0; i < upto; i++) paintLine(head, lines[i], i > 0);
    pre.textContent = "";
    pre.appendChild(head);
    setBusy(true);
    setProgress(upto / total);

    var rest = document.createElement("span");
    var cursor = upto;
    var step = function () {
      if (my !== renderSeq) return;        // 被新的一次渲染顶掉了：停手，别再抢主线程
      var t0 = Date.now();
      /* ★ 块预算要按「本块的起点」算，不能按 upto（表头）算 ——
         按 upto 算的话第一块就会把 300 行的额度用光，之后每块一进来
         `cursor - upto` 已经 ≥ 300 → 一行都画不了，只能无限重排下去。
         这个 bug 的表现是「进度条永远停在同一格、页面一直转」，
         由「抽干后必须逐字节完整」这条断言抓出来。 */
      var from = cursor;
      while (cursor < total && cursor - from < HL_CHUNK_LINES && Date.now() - t0 < HL_CHUNK_MS) {
        paintLine(rest, lines[cursor], true);
        cursor++;
      }
      setProgress(cursor / total);
      if (cursor < total) { yieldToMain(step); return; }
      pre.appendChild(rest);               // 其余一次性挂上：整段只多一次布局
      setBusy(false);
    };
    yieldToMain(step);
  }

  function renderOutput(text) {
    var my = ++renderSeq;                  // 抢过渲染权（老的分帧任务下一拍会自己收手）
    var pre = els.output;
    /* 一层缩进占几列：写成 <pre> 上的 CSS 变量，让参考线渐变跟着走。
       tab 的宽度由 tab-size 定（CSS 里是 2），所以 tab 缩进落在同一条规则上。 */
    var unit = els.indent.value === "4" ? 4 : 2;

    setBusy(false);
    if (!text) { pre.textContent = ""; return; }
    if (byteSize(text) > HL_MAX_BYTES) { pre.textContent = text; return; }

    var lines = splitLines(tokenize(text));
    var elems = countElements(lines);
    if (elems > HL_MAX_ELEMENTS) { pre.textContent = text; return; }

    pre.style.setProperty("--ind-w", unit + "ch");
    if (elems <= HL_SYNC_ELEMENTS) {
      /* 小输入：先拼在脱离文档的容器里，最后一次性挂上去，避免逐节点触发重排。
         这条路上**没有任何异步** —— 常见场景的行为与改造前逐字节一致。 */
      var host = document.createElement("span");
      for (var li = 0; li < lines.length; li++) paintLine(host, lines[li], li > 0);
      pre.textContent = "";
      pre.appendChild(host);
      return;
    }
    paintChunked(pre, lines, my);
  }

  /* 统一的「产出结果」收尾：写输出、更新 meta、出状态（有告警优先显示告警） */
  function deliver(out, label) {
    renderOutput(out);
    unmarkStale();
    syncOutputActions();
    els.outMeta.textContent = countLines(out) + " 行 · " + byteSize(out) + " 字节";
    var warn = collectWarnings();
    if (warn) {
      /* 有警告时**不**弹 toast —— 这条信息要留着让人看完，不能自己消失 */
      setStatus("warn", "⚠", "已" + label + "，但请注意：" + warn);
    } else {
      clearStatus();
      toast("已" + label + " · " + countLines(out) + " 行 · " + byteSize(out) + " 字节");
    }
  }

  function guardSize() {
    var n = byteSize(els.input.value);
    if (n <= MAX_BYTES) return false;
    setStatus("warn", "⚠", "这段内容有 " + Math.round(n / 1048576 * 10) / 10 + " MB，超过 " +
      (MAX_BYTES / 1048576) + " MB 的处理上限。浏览器里全量重排会明显卡顿 —— " +
      "建议先在本地切小，或改用命令行（jq）处理。");
    return true;
  }

  function doFormat() {
    if (guardSize()) return;
    var r = formatJson(els.input.value, els.indent.value);
    if (!r.ok) { showError(r.error); return; }
    deliver(r.value, "格式化");
  }

  function doMinify() {
    if (guardSize()) return;
    var r = minifyJson(els.input.value);
    if (!r.ok) { showError(r.error); return; }
    deliver(r.value, "压缩");
  }

  /* 「只校验」不碰输出区 —— 用户可能刚格式化过、正想核对一下，
     把结果清掉是帮倒忙。这里只回报结论。 */
  function doValidate() {
    if (guardSize()) return;
    var r = validateJson(els.input.value);
    if (!r.ok) { showError(r.error); return; }
    var t = els.input.value;
    var warn = collectWarnings();
    if (warn) setStatus("warn", "⚠", "是合法的 JSON，但请注意：" + warn);
    else { clearStatus(); toast("是合法的 JSON · " + countLines(t) + " 行 · " + byteSize(t) + " 字节"); }
  }

  function doClear() {
    els.input.value = "";
    renderOutput("");
    els.inMeta.textContent = "—";
    els.outMeta.textContent = "—";
    sourceName = "";
    unmarkStale();
    syncOutputActions();
    setStatus("", "·", "已清空。粘贴 JSON 后按 Ctrl + Enter 直接格式化。");
    els.input.focus();
  }

  /* 排序：**只重排对象的键，数组顺序原样保留**（数组顺序是语义，排了就错）。
     和格式化/压缩一样，结果进结果区、不覆盖输入区 —— 用户随时能改回去。 */
  function doSort() {
    if (guardSize()) return;
    var r = parseJson(els.input.value);
    if (!r.ok) { showError(r.error); return; }
    var sorted = sortKeysDeep(r.value, compareKeys);
    deliver(JSON.stringify(sorted, null, indentOf(els.indent.value)), "排序");
  }

  /* ---------- 复制 ---------- */
  /* 老路子：造一个离屏 textarea、选中它、再 execCommand('copy')。
     刻意**不复用结果区**：一是改了它的选区会动到用户自己选中的内容，
     二是结果区以后要换成 <pre>（没有 select()）。所以自己造一个临时的用完就撤。 */
  function legacyCopy(text) {
    if (typeof document.execCommand !== "function") return false;
    var ta = null;
    try {
      ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      return !!document.execCommand("copy");
    } catch (_) {
      return false;
    } finally {
      if (ta && ta.parentNode) ta.parentNode.removeChild(ta);
    }
  }

  /* 复制到剪贴板，两条路都留着：
     ① `navigator.clipboard`（需要 secure context。`file://` 在 Chrome 里算 secure，
        但 Firefox / 企业策略 / CSP 都可能让它不可用或直接抛，所以不能当作必然成功）
     ② 上面的离屏 textarea 老路 —— 几乎所有环境都能用。
     必须在**用户点击的同步回调**里调用，否则拿不到 user activation。 */
  function copyText(text) {
    var yes = function (how) { return { ok: true, how: how }; };
    var no = function (why) { return { ok: false, why: why }; };
    var nav = (typeof navigator !== "undefined") ? navigator : null;
    if (nav && nav.clipboard && typeof nav.clipboard.writeText === "function") {
      try {
        return nav.clipboard.writeText(text).then(
          function () { return yes("clipboard"); },
          function () { return legacyCopy(text) ? yes("legacy") : no("浏览器拒绝了剪贴板写入"); }
        );
      } catch (_) { /* 同步抛就落到老路 */ }
    }
    return Promise.resolve(legacyCopy(text) ? yes("legacy") : no("这个环境不支持剪贴板 API"));
  }

  /* ---------- 下载 ---------- */
  /* Blob + 一个临时 <a download>。file:// 下可用，但有两条硬约束：
     必须由用户点击触发（不能在 load 里自动下），文件只能落到浏览器下载目录
     （不能选位置、不能覆盖同名）。所以用完就把 object URL 撤掉，别漏内存。 */
  function downloadText(text, filename) {
    try {
      var blob = new Blob([text], { type: "application/json;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      return { ok: true, name: filename };
    } catch (e) {
      return { ok: false, why: String((e && e.message) || e) };
    }
  }

  /* 下载文件名的默认值：读进来过文件就用它的主干名，粘贴进来的就用默认名。 */
  function outputFilename() {
    if (!sourceName) return "formatted.json";
    var base = sourceName.replace(/\.[^.]+$/, "");
    return (base || "formatted") + ".json";
  }

  /* ---------- 读文件 ---------- */
  /* 优先 File.text()；老浏览器回落到 FileReader。
     刻意**不做扩展名白名单** —— 实际拿到的常是 .txt、甚至没有扩展名，
     卡白名单只会把人挡在外面。真正的把关交给后面的 JSON 校验。 */
  function readFileAsText(file) {
    if (file && typeof file.text === "function") return file.text();
    return new Promise(function (res, rej) {
      try {
        var fr = new FileReader();
        fr.onload = function () { res(String(fr.result)); };
        fr.onerror = function () { rej(fr.error || new Error("读取失败")); };
        fr.readAsText(file);
      } catch (e) { rej(e); }
    });
  }

  /* 统一入口：拖入 / 选文件都走这里 —— BOM 剥离、meta 刷新、超限劝退只写一遍。 */
  function loadText(text, name) {
    var s = stripBOM(String(text == null ? "" : text));
    els.input.value = s;
    sourceName = name || "";
    syncMeta();
    markStale();
    if (guardSize()) return;        // 超限时 guardSize 自己已经出了提示
    if (!s.trim()) {
      setStatus("warn", "⚠", "这个文件是空的（或者只有空白）。");
      return;
    }
    clearStatus();
    toast("已读入 " + (name || "内容") + " · " + countLines(s) + " 行 · " + byteSize(s) + " 字节");
  }

  function loadFile(file) {
    if (!file) return;
    readFileAsText(file).then(
      function (t) { loadText(t, file.name || ""); },
      function (e) {
        setStatus("error", "✗", "读不了这个文件：" + String((e && e.message) || e) +
          "。它可能不是纯文本（.xlsx / .docx / .zip 这些本质是压缩包）。");
      }
    );
  }

  /* ---------- 拖入文件 ---------- */
  function dragHasFiles(e) {
    var dt = e && e.dataTransfer;
    if (!dt) return false;
    if (dt.files && dt.files.length) return true;
    var types = dt.types;
    if (!types) return false;
    for (var i = 0; i < types.length; i++) if (types[i] === "Files") return true;
    return false;
  }
  function setDropping(on) {
    document.body.classList[on ? "add" : "remove"]("dropping");
  }

  /* 最容易漏的一步：**必须拦 dragover**。
     不拦的话浏览器会认为这个页面不接受拖放，于是把文件当成导航目标**直接打开** ——
     页面被顶掉，输入区里还没保存的内容一起没了。这类功能最常见的翻车点就是它。 */
  document.addEventListener("dragover", function (e) {
    if (!dragHasFiles(e)) return;     // 拖的是选中的文字就别管
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = "copy";
    setDropping(true);
  });
  document.addEventListener("dragleave", function (e) {
    /* relatedTarget 为 null 才是真的离开了窗口。拖过页面内的子元素时它不为 null，
       那时收起提示会一闪一闪。 */
    if (!e.relatedTarget) setDropping(false);
  });
  document.addEventListener("drop", function (e) {
    if (!dragHasFiles(e)) return;
    e.preventDefault();               // 同上：不拦的话浏览器会自己"打开"这个文件
    setDropping(false);
    var files = e.dataTransfer && e.dataTransfer.files;
    if (files && files.length) loadFile(files[0]);   // 一次只读一个，取第一个
  });

  /* 输出区空的时候复制/下载没有意义 —— 直接置灰，比"点了没反应"清楚 */
  function syncOutputActions() {
    /* 分帧渲染还没画完时**不给复制/下载** —— textContent 这时还是半截的，
       点下去会静默拿到不完整的 JSON。禁用按钮比拿到错数据好得多，
       而且进度条本来就在说「还在着色」，用户等一拍就行。 */
    var empty = rendering || !outputText();
    els.btnCopy.disabled = empty;
    els.btnDownload.disabled = empty;
  }

  function doCopy() {
    var text = outputText();
    if (!text) { setStatus("", "·", "还没有结果可复制。"); return; }
    copyText(text).then(function (r) {
      if (r.ok) { clearStatus(); toast("已复制 " + byteSize(text) + " 字节到剪贴板"); }
      else setStatus("error", "✗", "自动复制没成功（" + r.why +
        "）—— 点一下结果区按 Ctrl + A 再 Ctrl + C 一样能拿到。");
    });
  }

  function doDownload() {
    var text = outputText();
    if (!text) { setStatus("", "·", "还没有结果可下载。"); return; }
    var r = downloadText(text, outputFilename());
    if (r.ok) { clearStatus(); toast("已下载 " + r.name + " · 在浏览器的下载目录里"); }
    else setStatus("error", "✗", "下载没成功（" + r.why + "）—— 可以改用「复制」自己存。");
  }

  /* ---------- 事件 ---------- */
  els.btnFormat.addEventListener("click", doFormat);
  els.btnMinify.addEventListener("click", doMinify);
  els.btnSort.addEventListener("click", doSort);
  els.btnValidate.addEventListener("click", doValidate);
  els.btnClear.addEventListener("click", doClear);
  els.btnCopy.addEventListener("click", doCopy);
  els.btnDownload.addEventListener("click", doDownload);
  els.btnOpenFile.addEventListener("click", function () { els.fileInput.click(); });
  els.fileInput.addEventListener("change", function () {
    var f = els.fileInput.files && els.fileInput.files[0];
    loadFile(f);                      // 先启动读取
    /* 再清 value：不清的话连续选同一个文件不会再触发 change。
       放在启动读取之后，是为了让 File 对象的生命周期万无一失。 */
    try { els.fileInput.value = ""; } catch (_) {}
  });
  els.btnTheme.addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    writeTheme(next);
  });

  els.input.addEventListener("input", function () { syncMeta(); markStale(); });
  els.input.addEventListener("keydown", function (e) {
    /* Ctrl / Cmd + Enter：不用离开键盘就能格式化 */
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      doFormat();
    }
  });

  /* Tab 在 textarea 里默认会跳走焦点。这里让它在输入框内插入缩进，
     更符合「往这儿贴代码」的直觉；但只有在输入框聚焦时才拦。 */
  els.input.addEventListener("keydown", function (e) {
    if (e.key !== "Tab" || e.ctrlKey || e.metaKey || e.altKey) return;
    e.preventDefault();
    var el = els.input, s = el.selectionStart, t = el.value;
    el.value = t.slice(0, s) + "  " + t.slice(el.selectionEnd);
    el.selectionStart = el.selectionEnd = s + 2;
    syncMeta();
    markStale();
  });

  /* 输出区是 <pre>，它的 Ctrl+A 默认是「全选整个页面」——会把按钮上的文字也一起选进去。
     原来 textarea 自带「Ctrl+A 只选自己」，所以这里把选区限定回输出区，
     保住提示里承诺的那条行为。缺 Range / Selection 的老环境直接放行默认行为 ——
     宁可退回「全选整页」，也不要静默把 Ctrl+A 吞掉。 */
  els.output.addEventListener("keydown", function (e) {
    if (!(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey) return;
    if (e.key !== "a" && e.key !== "A") return;
    var sel = (typeof window !== "undefined" && window.getSelection) ? window.getSelection() : null;
    if (!sel || typeof document.createRange !== "function") return;
    var r = document.createRange();
    r.selectNodeContents(els.output);
    sel.removeAllRanges();
    sel.addRange(r);
    e.preventDefault();
  });

  /* 把 UI 层里值得单测的动作挂到同一个命名空间上，供测试直接驱动。
     浏览器里的正常流程不依赖它们 —— 但这样测试才能覆盖
     「复制走哪条路 / 下载的文件名与回收 / 拖入能不能读进来」这些真实行为。 */
  API.copyText = copyText;
  API.legacyCopy = legacyCopy;
  API.downloadText = downloadText;
  API.readFileAsText = readFileAsText;
  API.sortKeysDeep = sortKeysDeep;
  /* 高亮阈值与分帧参数：测试要贴着边界造输入，所以全都暴露出去，
     免得测试里再抄一遍数字（抄一遍就多一个会漂移的常量）。
     —— 数字一旦漂移，测试就变成在测「自己抄的那份」，而不是产品里那份。 */
  API.HL_MAX_BYTES = HL_MAX_BYTES;
  API.HL_MAX_ELEMENTS = HL_MAX_ELEMENTS;
  API.HL_SYNC_ELEMENTS = HL_SYNC_ELEMENTS;
  API.HL_FIRST_LINES = HL_FIRST_LINES;
  API.HL_CHUNK_LINES = HL_CHUNK_LINES;
  /* 分帧渲染的状态与内部件也暴露出来：
     「还在画」这件事测试必须能观察到，否则「渲染中禁用复制」这条断言只能靠猜。 */
  API.isRendering = function () { return rendering; };
  API.countElements = countElements;
  API.splitLines = splitLines;
  API.fragClass = fragClass;

  initTheme();
  syncMeta();
  syncOutputActions();
  els.input.focus();
})();
</script>
</body>
</html>
