<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V1 演示文稿</title>
  <script>
    // 主题防闪烁：与壳共享 localStorage
    (function () {
      try {
        var t = localStorage.getItem('ppt-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) { /* 忽略 */ }
    })();
  </script>
  <link rel="stylesheet" href="V1/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="V1/app.js"></script>
</head>
<body>
  <!-- 第1页：标题页 -->
  <section class="slide-page" data-index="0">
    <div class="slide-inner slide-title">
      <p class="eyebrow">AI PRESENTATION ENGINE</p>
      <h1>AI PPT Player</h1>
      <p class="subtitle">高性能 · 版本隔离 · 可编辑的幻灯片引擎</p>
    </div>
  </section>

  <!-- 第2页：图表页 -->
  <section class="slide-page" data-index="1">
    <div class="slide-inner slide-chart">
      <h2>季度增长数据</h2>
      <p class="chart-caption">近四个季度营收趋势（单位：万元）</p>
      <div id="chart-container"></div>
    </div>
  </section>

  <!-- 第3页：总结页 -->
  <section class="slide-page" data-index="2">
    <div class="slide-inner slide-summary">
      <h2>核心特性</h2>
      <ul class="feature-list">
        <li>
          <span class="feature-num">01</span>
          <div class="feature-body">
            <h3>版本隔离</h3>
            <p>每个版本运行在独立 Iframe 沙盒中，互不干扰，无全局变量冲突。</p>
          </div>
        </li>
        <li>
          <span class="feature-num">02</span>
          <div class="feature-body">
            <h3>微前端架构</h3>
            <p>壳与内容解耦，通过 <code>__SLIDE_ENGINE__</code> 契约通信，支持多版本共存与热切换。</p>
          </div>
        </li>
        <li>
          <span class="feature-num">03</span>
          <div class="feature-body">
            <h3>编辑预留</h3>
            <p>文本节点已预留 contenteditable 能力，修改后可回传至壳做持久化。</p>
          </div>
        </li>
      </ul>
    </div>
  </section>
</body>
</html>
