<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI PPT Player</title>
  <script>
    // 主题防闪烁：在渲染前同步读取 localStorage，避免首帧闪烁
    (function () {
      try {
        var t = localStorage.getItem('ppt-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) { /* 忽略存储不可用的情况 */ }
    })();
  </script>
  <style>
    :root {
      --bg: #f5f4f1;
      --surface: #ffffff;
      --ink: #16181d;
      --muted: #6b7280;
      --line: #e5e3dd;
      --accent: #3b5bdb;
      --accent-ink: #ffffff;
      --shadow: 0 10px 40px rgba(20, 24, 40, 0.10);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "SF Mono", "Cascadia Code", Consolas, monospace;
    }

    [data-theme="dark"] {
      --bg: #121317;
      --surface: #1b1d23;
      --ink: #eef0f4;
      --muted: #9aa1ad;
      --line: #2a2d35;
      --accent: #7c9bff;
      --accent-ink: #0f1116;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body { display: flex; flex-direction: column; }

    /* ===== 顶栏 ===== */
    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.01em;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 27px;
      height: 27px;
      border-radius: 7px;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 12px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .version-select {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink);
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .version-select:hover,
    .version-select:focus { border-color: var(--accent); }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
    [data-theme="light"] .icon-moon { display: none; }
    [data-theme="dark"] .icon-sun { display: none; }

    /* ===== 舞台 ===== */
    .stage {
      flex: 1 1 auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-height: 0;
    }

    #ppt-renderer {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== 底栏控制 ===== */
    .controls {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 22px;
      border-top: 1px solid var(--line);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 40px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
    }
    .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-nav { width: 40px; padding: 0; font-size: 16px; }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }
    .btn-primary:hover:not(:disabled) { color: var(--accent-ink); opacity: 0.9; }

    .page-indicator {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--muted);
      min-width: 64px;
      text-align: center;
      user-select: none;
    }
    .page-indicator .cur { color: var(--ink); font-weight: 700; }
    .page-indicator .sep { margin: 0 4px; opacity: 0.5; }

    .spacer { flex: 1 1 auto; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">▶</span>
      <span>AI PPT Player</span>
    </div>
    <div class="topbar-right">
      <select class="version-select" id="version-select" aria-label="切换版本"></select>
      <button class="theme-toggle" id="theme-toggle" title="切换主题" aria-label="切换主题">
        <svg class="icon icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
        <svg class="icon icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main class="stage">
    <iframe id="ppt-renderer" title="幻灯片渲染器" srcdoc=""></iframe>
    <div class="loading" id="loading">
      <span class="spinner"></span>
      <span>正在加载演示文稿…</span>
    </div>
  </main>

  <footer class="controls">
    <button class="btn btn-nav" id="prev-btn" aria-label="上一页">←</button>
    <div class="page-indicator">
      <span class="cur" id="page-current">1</span><span class="sep">/</span><span id="page-total">1</span>
    </div>
    <button class="btn btn-nav" id="next-btn" aria-label="下一页">→</button>
    <div class="spacer"></div>
    <button class="btn btn-primary" id="download-btn">下载</button>
  </footer>

  <script>
    (function () {
      var iframe = document.getElementById('ppt-renderer');
      var pageCurrent = document.getElementById('page-current');
      var pageTotal = document.getElementById('page-total');
      var prevBtn = document.getElementById('prev-btn');
      var nextBtn = document.getElementById('next-btn');
      var downloadBtn = document.getElementById('download-btn');
      var themeToggle = document.getElementById('theme-toggle');
      var versionSelect = document.getElementById('version-select');
      var loading = document.getElementById('loading');

      var totalPages = 1;
      var currentPage = 0;
      var isNavigating = false;
      var engineReady = false;
      var manifest = null;

      // ---- 导出态检测：iframe 的 srcdoc 已预填（即导出的自包含单文件） ----
      var isExportMode = (function () {
        var preset = iframe.getAttribute('srcdoc');
        return !!(preset && preset.trim() !== '');
      })();

      // ---- 版本清单 ----
      async function loadManifest() {
        var res = await fetch('manifest.json');
        manifest = await res.json();
        return manifest;
      }

      // ---- 版本加载器 ----
      async function loadVersion(versionId) {
        // 加载新版前，先销毁旧引擎（防止定时器 / 图表残留导致内存泄漏）
        try {
          var oldEngine = iframe.contentWindow && iframe.contentWindow.__SLIDE_ENGINE__;
          if (oldEngine && typeof oldEngine.destroy === 'function') {
            oldEngine.destroy();
          }
        } catch (e) { /* 跨域或初始化失败时忽略 */ }

        // 重置壳侧状态，等待新 iframe 就绪后由 syncFromEngine 恢复
        currentPage = 0;
        totalPages = 1;
        engineReady = false;
        isNavigating = false;
        updateUI();

        try {
          if (!manifest) await loadManifest();
          var targetId = versionId || manifest.latest;
          var version = manifest.versions.find(function (v) { return v.id === targetId; });
          if (!version) throw new Error('未找到版本: ' + targetId);

          if (versionSelect && versionSelect.value !== version.id) {
            versionSelect.value = version.id;
          }

          if (loading) {
            loading.style.display = 'flex';
            loading.innerHTML = '<span class="spinner"></span><span>正在加载 ' + version.id + '…</span>';
          }

          var html = await (await fetch(version.entry)).text();
          iframe.srcdoc = html;
        } catch (err) {
          if (loading) loading.innerHTML = '加载失败：' + err.message;
        }
      }

      // ---- 版本切换器：填充下拉项并绑定切换 ----
      async function initVersionSelect() {
        try {
          if (!manifest) await loadManifest();
          manifest.versions.forEach(function (v) {
            var opt = document.createElement('option');
            opt.value = v.id;
            opt.textContent = v.id + ' · v' + v.version;
            versionSelect.appendChild(opt);
          });
          versionSelect.value = manifest.latest;
          versionSelect.addEventListener('change', function () {
            loadVersion(versionSelect.value);
          });
        } catch (e) { /* 忽略 */ }
      }

      // ---- 主题 ----
      function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        try { localStorage.setItem('ppt-theme', theme); } catch (e) {}
        try {
          iframe.contentWindow.postMessage({ type: 'THEME_CHANGE', theme: theme }, '*');
        } catch (e) {}
      }

      themeToggle.addEventListener('click', function () {
        var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        setTheme(cur);
      });

      // ---- iframe 就绪 ----
      iframe.addEventListener('load', function () {
        var engine = iframe.contentWindow && iframe.contentWindow.__SLIDE_ENGINE__;
        if (engine) syncFromEngine(engine);
      });

      function syncFromEngine(engine) {
        totalPages = engine.totalPages || 1;
        currentPage = engine.currentIndex || 0;
        engineReady = true;
        if (loading) loading.style.display = 'none';
        updateUI();
      }

      function updateUI() {
        pageCurrent.textContent = currentPage + 1;
        pageTotal.textContent = totalPages;
        prevBtn.disabled = currentPage <= 0;
        nextBtn.disabled = currentPage >= totalPages - 1;
      }

      // ---- 翻页 ----
      async function go(step) {
        if (isNavigating) return;
        var engine = iframe.contentWindow && iframe.contentWindow.__SLIDE_ENGINE__;
        if (!engine || !engineReady) return;

        var next = currentPage + step;
        if (next < 0 || next >= totalPages) return;

        isNavigating = true;
        var transition = step > 0 ? 'slide-left' : 'slide-right';
        await engine.goTo(next, transition);
        currentPage = next;
        isNavigating = false;
        updateUI();
      }

      prevBtn.addEventListener('click', function () { go(-1); });
      nextBtn.addEventListener('click', function () { go(1); });

      // ---- 键盘导航（修复：输入/编辑时误触翻页） ----
      window.addEventListener('keydown', function (e) {
        var el = e.target;
        // 焦点在输入框或可编辑文本上时不翻页
        if (el && el instanceof Element &&
            (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' ||
             el.closest('[contenteditable="true"]'))) {
          return;
        }
        if (e.key === 'ArrowLeft') go(-1);
        else if (e.key === 'ArrowRight') go(1);
      });

      // ---- 内联本地资源（V{N}/xxx.css、xxx.js），使导出的单文件真正自包含 ----
      async function inlineAssets(html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');

        var links = doc.querySelectorAll('link[rel="stylesheet"][href]:not([href^="http"])');
        for (var i = 0; i < links.length; i++) {
          var link = links[i];
          try {
            var css = await (await fetch(link.getAttribute('href'))).text();
            var style = doc.createElement('style');
            style.textContent = css;
            link.replaceWith(style);
          } catch (e) { /* 内联失败则保留原 link */ }
        }

        var scripts = doc.querySelectorAll('script[src]:not([src^="http"])');
        for (var j = 0; j < scripts.length; j++) {
          var s = scripts[j];
          try {
            var js = await (await fetch(s.getAttribute('src'))).text();
            var inline = doc.createElement('script');
            // 防 script 闭合标签提前终止（script 元素是 raw text，序列化时不转义）
            // 注意：不能在 JS 源码里出现 script 闭合序列，否则 HTML 解析器会提前结束 <script> 块
            inline.textContent = js.replace(
              new RegExp('<' + '/script', 'gi'),
              '<' + '\\/script'
            );
            s.replaceWith(inline);
          } catch (e) { /* 内联失败则保留原 script */ }
        }

        return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
      }

      // ---- 下载导出：单页自包含 HTML ----
      downloadBtn.addEventListener('click', async function () {
        // 单一事实来源：直接读 iframe 当前 srcdoc（与显示强一致），避免内存变量与显示脱节
        var html = iframe.getAttribute('srcdoc');
        if (!html || html.trim() === '') {
          alert('内容仍在加载，请稍候再试。');
          return;
        }
        try {
          // 1. 内联版本资源，规避导出后 V{N}/xxx 相对路径失效
          var slideDocHtml = await inlineAssets(html);

          // 2. 克隆壳文档，用 DOM API 写入 srcdoc（自动转义，不碰正则）
          var clone = document.documentElement.cloneNode(true);
          var iframeClone = clone.querySelector('#ppt-renderer');
          iframeClone.setAttribute('srcdoc', slideDocHtml);

          // 2.5 修复：cloneNode 不复制 <select> 的选中态，且 select.value 的反射
          // 未必写回 option 的 HTML attribute。这里显式给对应 option 打 selected 内容属性，
          // 确保序列化后导出的下拉正确显示当前版本（否则默认回落到第一个选项）
          var versionClone = clone.querySelector('#version-select');
          if (versionClone && versionSelect) {
            for (var k = 0; k < versionClone.options.length; k++) {
              if (versionClone.options[k].value === versionSelect.value) {
                versionClone.options[k].setAttribute('selected', '');
              } else {
                versionClone.options[k].removeAttribute('selected');
              }
            }
          }

          // 3. 隐藏加载遮罩，导出文件打开即干净呈现
          var loadingClone = clone.querySelector('#loading');
          if (loadingClone) loadingClone.style.display = 'none';

          // 4. 序列化 + 下载
          var blob = new Blob(['<!DOCTYPE html>\n' + clone.outerHTML], { type: 'text/html;charset=utf-8' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'AI_PPT_Player.html';
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        } catch (err) {
          alert('导出失败：' + err.message);
        }
      });

      // ---- 消息监听：引擎就绪 / 编辑回传 ----
      window.addEventListener('message', function (e) {
        var data = e.data;
        if (!data || typeof data !== 'object') return;

        if (data.type === 'SLIDE_READY') {
          totalPages = data.totalPages || 1;
          currentPage = 0;
          engineReady = true;
          if (loading) loading.style.display = 'none';
          updateUI();
        } else if (data.type === 'EDIT_CONTENT') {
          console.log('收到Iframe编辑数据:', data);
        }
      });

      // ---- 初始化 ----
      updateUI();
      if (isExportMode) {
        // 导出态：内容已内联，禁用在线功能，等待 iframe load 后 syncFromEngine
        if (versionSelect) versionSelect.disabled = true;
        if (downloadBtn) downloadBtn.disabled = true;
      } else {
        initVersionSelect();
        loadVersion();
      }
    })();
  </script>
</body>
</html>
