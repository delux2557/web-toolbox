<link rel="stylesheet" href="V7/style.css" />

<!-- 图标集（内联 sprite，零外部依赖）：24×24 描边，用 <use href="#id"> 引用。
     ic-copy / ic-download 与 url-helper / param-analysis / table-helper 是同一套字形，
     stroke 全部走 currentColor，所以图标自动跟随所在文字色与深浅主题。
     ★ JS 里拼 HTML 的那几处（场景弹窗 / 定位条）也用这里的 id，别再写回彩色 emoji。 -->
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="ic-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="8" width="13" height="13" rx="2"/>
    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
  </symbol>
  <symbol id="ic-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3"/>
    <path d="M7 10l5 5 5-5"/>
    <path d="M12 15V3"/>
  </symbol>
  <symbol id="ic-tree" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 4v15"/>
    <path d="M5 8h5"/>
    <path d="M5 15h5"/>
    <rect x="10" y="5.5" width="9" height="5" rx="1"/>
    <rect x="10" y="12.5" width="9" height="5" rx="1"/>
  </symbol>
  <symbol id="ic-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
    <path d="M14 3v5h5"/>
  </symbol>
  <symbol id="ic-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 6h8"/><path d="M16 6h4"/><circle cx="14" cy="6" r="2"/>
    <path d="M4 12h4"/><path d="M12 12h8"/><circle cx="10" cy="12" r="2"/>
    <path d="M4 18h8"/><path d="M16 18h4"/><circle cx="14" cy="18" r="2"/>
  </symbol>
  <symbol id="ic-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
    <circle cx="12" cy="12" r="3"/>
  </symbol>
  <symbol id="ic-target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8"/>
    <circle cx="12" cy="12" r="2.5"/>
    <path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/>
  </symbol>
</svg>

<div class="bg-glow" aria-hidden="true"></div>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 6l-4 6 4 6M17 6l4 6-4 6M13.5 4l-3 16" />
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">Context</span>
        <span class="brand-sub">codebase → markdown</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="themeToggle" title="切换明暗主题" aria-label="切换明暗主题">
        <svg id="themeIconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg id="themeIconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- Empty state -->
    <section class="empty" id="emptyState">
      <div class="empty-card">
        <!-- 这枚徽标只陈述状态（本地运行），不是可点的东西，所以不给图标 ——
             图标表达动作、文字表达对象；给它配个放大镜反而是假动作。 -->
        <div class="empty-badge">本地运行 · 数据不离开浏览器</div>
        <h1>把代码库变成 <span class="accent">AI 上下文</span></h1>
        <p class="lead">选择一个项目文件夹，自动生成「目录树 + 文件内容」的 Markdown，复制或下载后直接用于 AI 对话。</p>
        <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="选择文件夹">
          <svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          </svg>
          <div class="dz-title">选择文件夹</div>
          <div class="dz-hint">点击浏览，或将文件夹拖拽到此处</div>
        </div>
        <div class="empty-features">
          <span class="feature"><b>智能过滤</b> 忽略 node_modules / .git / 二进制</span>
          <span class="feature"><b>5MB 上限</b> 超大文件自动跳过</span>
          <span class="feature"><b>一键导出</b> 复制 / 下载 .md</span>
        </div>
        <div class="compat-note" id="compatNote"></div>
      </div>
    </section>

    <!-- Scanning -->
    <section class="scan" id="scanState" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <div class="scan-text">
        <div class="t1">正在扫描文件…</div>
        <div class="t2" id="currentFile">准备中</div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-label"><span id="progressText">已扫描 0 个文件</span><span id="progressPct">0%</span></div>
      </div>
    </section>

    <!-- Results -->
    <section class="results" id="resultsState" hidden>
      <div class="toolbar">
        <!-- 图标与文字拆成两块：JS 会按「内容过大 / 正常」改文案，
             整体覆写 textContent 会把里面的 <svg> 一起抹掉（table-helper 踩过这个坑）。 -->
        <button class="btn btn-primary" id="copyBtn"><svg class="ico" aria-hidden="true"><use href="#ic-copy"/></svg><span id="copyBtnText">一键复制</span></button>
        <button class="btn btn-ghost" id="downloadBtn"><svg class="ico" aria-hidden="true"><use href="#ic-download"/></svg>下载 .md</button>
        <label class="switch">
          <input type="checkbox" id="lineNumToggle" />
          <span class="track"></span>
          行号
        </label>
        <div class="spacer"></div>
        <button class="btn btn-ghost btn-sm rules-toggle" id="rulesToggleBtn" type="button" title="过滤">
          <svg class="rules-toggle-ico" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18l-7 8v6l-4 2v-8L3 4z"/></svg>
          过滤
        </button>
        <button class="btn btn-ghost btn-sm" id="reselectBtn">↺ 重新选择</button>
      </div>

      <div class="layout">
        <aside class="panel">
          <div class="panel-head"><svg class="ico" aria-hidden="true"><use href="#ic-tree"/></svg>目录结构<span class="count" id="treeCount"></span></div>
          <div class="tree-scroll"><div class="tree" id="treeRoot"></div></div>
        </aside>
        <section class="panel">
          <div class="panel-head">
            <span class="panel-title"><svg class="ico" aria-hidden="true"><use href="#ic-file"/></svg>内容预览</span>
            <span class="count" id="previewCount"></span>
            <span class="head-spacer"></span>
            <span class="scenario-label"><svg class="ico" aria-hidden="true"><use href="#ic-sliders"/></svg>场景</span>
            <select id="scenarioSelect" aria-label="选择场景"></select>
            <button class="btn btn-ghost btn-sm" id="previewPromptBtn" title="预览当前场景提示词"><svg class="ico" aria-hidden="true"><use href="#ic-eye"/></svg>预览</button>
          </div>
          <div class="preview-scroll">
            <div class="preview-banner" id="previewBanner">⚠ 预览已折叠 · 请下载完整文件查看全部内容</div>
            <div class="preview" id="preview"></div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <footer class="statusbar" id="statusbar" hidden>
    <span class="stat stat-proj" id="stProject"></span>
    <span class="sep-dot" aria-hidden="true">·</span>
    <span class="stat">文件 <b id="stFiles">0</b></span>
    <span class="stat">字符 <b id="stChars">0</b></span>
    <span class="stat">Token <b id="stTokens">0</b></span>
    <span class="spacer"></span>
    <span class="log" id="stLog"></span>
  </footer>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<input type="file" id="fileInput" webkitdirectory multiple hidden />

<script type="module" src="V7/src/main.js"></script>
