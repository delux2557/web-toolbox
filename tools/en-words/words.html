<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生词本 · 梦幻词栈</title>
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <style>
    /* 生词本特有样式 */
    .stats-bar {
      display: flex;
      gap: var(--space-md);
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: var(--space-lg);
    }
    .stat-item {
      background: var(--card-bg);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      padding: var(--space-md) var(--space-lg);
      text-align: center;
      min-width: 100px;
    }
    .stat-number {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--color-accent);
    }
    .stat-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .controls-bar {
      display: flex;
      gap: var(--space-sm);
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: var(--space-lg);
    }
    .test-mode-indicator {
      text-align: center;
      margin-bottom: var(--space-md);
      font-size: 0.85rem;
      color: var(--color-accent);
      font-weight: 600;
    }
    .word-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }
    .book-card {
      background: var(--card-bg);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      padding: var(--space-lg);
      transition: all var(--transition);
      cursor: default;
    }
    .book-card.mastered {
      background: var(--color-mastered);
    }
    .book-card.test-hidden .book-def,
    .book-card.test-hidden .book-example {
      filter: blur(6px);
      user-select: none;
      transition: filter 0.3s ease;
    }
    .book-card.test-reveal .book-def,
    .book-card.test-reveal .book-example {
      filter: blur(0);
    }
    .book-card-row {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      margin-bottom: var(--space-sm);
    }
    .book-word {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-primary);
    }
    .book-phonetic {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-family: var(--font-mono);
    }
    .book-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: auto;
    }
    .book-def {
      font-size: 0.9rem;
      color: var(--text-primary);
      margin-bottom: var(--space-sm);
      line-height: 1.5;
      transition: filter 0.3s ease;
    }
    .book-example {
      font-size: 0.83rem;
      color: var(--text-secondary);
      font-style: italic;
      background: rgba(111, 148, 216, 0.06);
      padding: var(--space-sm) var(--space-md);
      border-radius: 10px;
      line-height: 1.5;
      transition: filter 0.3s ease;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      cursor: pointer;
    }
    .book-example.expanded {
      -webkit-line-clamp: unset;
      display: block;
      overflow: visible;
    }
    .book-actions {
      display: flex;
      gap: var(--space-sm);
      margin-top: var(--space-md);
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 导航 -->
    <header class="app-header">
      <a href="../../index.html" class="header-back" aria-label="返回工具汇总站">&larr; 工具箱</a>
      <a href="index.html" class="header-nav-btn">✨ 去拾词</a>
    </header>

    <!-- 品牌 -->
    <section class="hero">
      <div class="hero-illustration">
        <img src="../../assets/images/moon-stars.svg" alt="月亮和星星插画" width="200" height="150">
      </div>
      <h1 class="hero-title">生词本</h1>
      <p class="hero-subtitle">温故而知新，每一步都算数</p>
    </section>

    <!-- 统计条 -->
    <div class="stats-bar" id="stats-bar">
      <div class="stat-item">
        <div class="stat-number" id="stat-total">0</div>
        <div class="stat-label">总词数</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="stat-review">0</div>
        <div class="stat-label">待复习</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="stat-mastered">0</div>
        <div class="stat-label">已掌握</div>
      </div>
    </div>

    <!-- 控制条 -->
    <div class="controls-bar">
      <button class="btn btn-secondary btn-sm" id="btn-test-mode" aria-label="切换自测模式">🔍 自测模式</button>
      <button class="btn btn-ghost btn-sm" id="btn-export" aria-label="导出生词本">📥 导出</button>
    </div>

    <!-- 自测模式提示 -->
    <div class="test-mode-indicator" id="test-indicator" style="display:none;">
      自测模式已开启 — 点击卡片揭示释义
    </div>

    <!-- 生词列表 -->
    <div class="word-list" id="word-list">
      <div class="empty-state" id="empty-state">
        <img src="../../assets/images/moon-stars.svg" alt="月亮和星星" width="160" height="120">
        <p>生词本还是空的</p>
        <p class="hint-text">快去拾取一些生词吧</p>
        <a href="index.html" class="btn btn-primary" style="margin-top:12px;display:inline-flex;">✨ 去拾词</a>
      </div>
    </div>

    <!-- 页脚 -->
    <footer class="app-footer">
      <p class="footer-quote" id="footer-quote"></p>
      <p class="footer-link"><a href="../../index.html">&larr; 返回工具汇总站</a></p>
    </footer>
  </div>

  <!-- 导出弹窗 -->
  <div class="overlay" id="export-overlay">
    <div class="dialog" role="dialog" aria-labelledby="export-title">
      <h3 id="export-title">导出生词本</h3>
      <button class="btn btn-primary example-btn" id="btn-copy-all">📋 一键复制到剪贴板</button>
      <button class="btn btn-secondary example-btn" id="btn-download-txt" style="margin-top:8px;">💾 下载 .txt 文件</button>
      <div class="dialog-actions">
        <button class="btn btn-ghost" id="btn-export-close">取消</button>
      </div>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script src="js/words.js"></script>
</body>
</html>
